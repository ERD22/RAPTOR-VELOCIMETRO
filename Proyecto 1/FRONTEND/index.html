<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Diaria</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Clerk -->
  <script defer src="https://capital-hound-93.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" crossorigin="anonymous" data-clerk-publishable-key="{{CLERK_PUBLISHABLE_KEY}}"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="container mx-auto px-4 py-8 max-w-4xl">
    
    <!-- Sección de Login/Registro con Clerk -->
    <div id="authSection" class="bg-white rounded-lg shadow-md p-6 mb-8">
      <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">📅 Agenda Diaria</h1>
      <div id="sign-in"></div>
    </div>
    
    <!-- Sección de Agenda (oculta hasta login) -->
    <div id="agendaSection" class="hidden">
      <div class="flex justify-between items-center mb-8">
        <div>
          <h1 class="text-3xl font-bold text-gray-800">📅 Agenda Diaria</h1>
          <p id="userInfo" class="text-sm text-gray-600 mt-1"></p>
        </div>
        <button onclick="logout()" class="bg-red-500 text-white py-2 px-4 rounded-lg hover:bg-red-600 transition-colors font-medium">
          Cerrar Sesión
        </button>
      </div>
      
      <!-- Formulario para agregar evento -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-8">
      <h2 class="text-xl font-semibold text-gray-700 mb-4">Nuevo Evento</h2>
      <form id="eventoForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Título *</label>
          <input type="text" id="titulo" required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Descripción</label>
          <textarea id="descripcion" rows="2"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Fecha *</label>
            <input type="date" id="fecha" required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Hora</label>
            <input type="time" id="hora"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Ubicación</label>
          <button type="button" onclick="obtenerUbicacion()" 
            class="w-full bg-purple-500 text-white py-2 px-4 rounded-lg hover:bg-purple-600 transition-colors font-medium mb-2">
            📍 Obtener mi ubicación actual
          </button>
          <div id="mapa" style="height: 300px; display: none;" class="rounded-lg border border-gray-300"></div>
          <div class="grid grid-cols-2 gap-4 mt-3">
            <div>
              <label class="block text-sm font-medium text-gray-600 mb-1">Latitud</label>
              <input type="text" id="latitud" readonly
                class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-gray-700 text-sm">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-600 mb-1">Longitud</label>
              <input type="text" id="longitud" readonly
                class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-gray-700 text-sm">
            </div>
          </div>
          <p id="ubicacionTexto" class="text-sm text-gray-500 mt-1"></p>
        </div>
        <button type="submit"
          class="w-full bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-blue-600 transition-colors font-medium">
          Agregar Evento
        </button>
      </form>
    </div>
    
    <!-- Lista de eventos -->
    <div class="bg-white rounded-lg shadow-md p-6">
      <h2 class="text-xl font-semibold text-gray-700 mb-4">Eventos</h2>
      <div id="eventosList" class="space-y-3">
        <p class="text-gray-500 text-center">Cargando eventos...</p>
      </div>
    </div>
    </div>
  </div>

  <script src="app.js?v=4"></script>
</body>
</html>
